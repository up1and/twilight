services:
  # Message queue and caching
  redis:
    image: redis:alpine
    ports: ["6379:6379"]
    restart: always

  # Object storage for raw and processed data
  minio:
    image: minio/minio
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: always

  # Flask API and Tile server
  server:
    build:
      context: ./server
    image: twilight-server:latest
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
    depends_on:
      - redis
      - minio
    restart: always

  # RQ worker for background tasks
  rq-worker:
    build:
      context: ./server
    image: twilight-server:latest
    command: flask rq worker --with-scheduler
    environment:
      - FLASK_APP=app.py
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
    depends_on:
      - redis
      - minio
    restart: always

  # RQ cron daemon for scheduled tasks
  rq-cron:
    build:
      context: ./server
    image: twilight-server:latest
    command: flask rq cron
    environment:
      - FLASK_APP=app.py
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis
    restart: always

  # Frontend web server and reverse proxy
  nginx:
    build:
      context: ./client
    image: twilight-client:latest
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports: ["80:80"]
    depends_on:
      - server
    restart: always

volumes:
  minio_data:
